<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 · 이엘소프트</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<style>
  body{margin:0; min-height:100vh; display:grid; place-items:center; background:#fafbfe; color:#151b2c;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo","Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif;
    line-height:1.7; word-break:keep-all; text-align:center; padding:24px}
  .code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:13px; font-weight:700;
    letter-spacing:.18em; color:#5c6784; margin:0 0 14px}
  h1{margin:0 0 10px; font-size:clamp(24px,5vw,34px); font-weight:800; letter-spacing:-.03em}
  h1 span{background:linear-gradient(100deg,#6a4df2,#1795b6 55%,#149b6c);
    -webkit-background-clip:text; background-clip:text; color:transparent}
  p{margin:0 0 26px; color:#5c6784}
  a.home{display:inline-block; padding:13px 26px; border-radius:14px; background:#151b2c; color:#fff;
    font-weight:700; text-decoration:none}
  a.home:hover{filter:brightness(1.3)}
  p.mail{margin-top:18px; font-size:14px}
  p.mail a{color:#4a35c9; text-decoration:none; font-weight:600}
</style>
</head>
<body>
<main>
  <p class="code">404 — NOT FOUND</p>
  <h1>페이지를 <span>찾을 수 없습니다</span></h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같아요.</p>
  <a class="home" href="/">홈으로 돌아가기</a>
  <p class="mail">문제가 계속되면 <a href="mailto:support@elsoftlab.com">support@elsoftlab.com</a></p>
</main>
</body>
</html>
